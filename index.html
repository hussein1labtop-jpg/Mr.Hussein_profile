<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأستاذ حسين النجار · مدرس الكيمياء</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf9f0;
    --surface:#ffffff;
    --ink:#2a3142;
    --ink-soft:#5f6779;
    --gold:#93876b;
    --gold-text:#6f6448;
    --line:rgba(42,49,66,.13);
    --shadow:0 18px 40px -22px rgba(42,49,66,.35);
    --logo-tile:#fcf9f0;
    --kufi:'Noto Kufi Arabic','Tajawal',sans-serif;
    --body:'Tajawal','Noto Kufi Arabic',sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141826; --surface:#1d2335; --ink:#efe9d8; --ink-soft:#a5abbb;
      --gold:#b5a780; --gold-text:#c9bb93; --line:rgba(239,233,216,.14);
      --shadow:0 18px 40px -22px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141826; --surface:#1d2335; --ink:#efe9d8; --ink-soft:#a5abbb;
    --gold:#b5a780; --gold-text:#c9bb93; --line:rgba(239,233,216,.14);
    --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  }
  *{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;min-height:100%;
    background-color:var(--bg);
        color:var(--ink);
    font-family:var(--body);
    display:flex;
    padding:28px 16px 36px;
    overflow-x:hidden;
  }
  .stage{position:relative;z-index:1;margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}

  .hero{text-align:center;position:relative;padding-top:14px}
  .diamond{
    position:absolute;top:0;left:50%;width:13px;height:13px;margin-left:-6.5px;
    background:var(--gold);transform:rotate(45deg);
  }
  .avatar{
    width:158px;height:158px;margin:0 auto 16px;position:relative;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:var(--gold);
  }
  .avatar .mid{position:absolute;inset:3px;background:var(--ink);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .avatar img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);
    object-fit:cover;display:block;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  h1{font-family:var(--kufi);font-weight:800;font-size:30px;line-height:1.3;margin:0 0 6px}
  .role{margin:0;font-size:16.5px;font-weight:500;color:var(--gold-text)}

  .institute{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;box-shadow:var(--shadow);
    transition:transform .18s ease,border-color .18s ease;
  }
  .institute:hover{transform:translateY(-2px);border-color:var(--gold)}
  .logo-tile{width:64px;height:64px;flex:none;border-radius:12px;background:var(--logo-tile);
    display:grid;place-items:center;overflow:hidden}
  .logo-tile img{width:100%;height:100%;object-fit:contain;display:block}
  .institute .t{flex:1;min-width:0}
  .institute .t b{display:block;font-family:var(--kufi);font-size:18px;font-weight:700}
  .institute .t span{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px}

  .group-title{margin:2px 4px -8px;font-size:13.5px;font-weight:700;color:var(--ink-soft);
    display:flex;align-items:center;gap:10px}
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .links{display:flex;flex-direction:column;gap:10px}
  .row{
    --c:var(--gold);
    display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    transition:transform .18s ease,border-color .18s ease;
  }
  .row:hover{transform:translateY(-2px);border-color:var(--c)}
  .row .ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--c);
    background:color-mix(in srgb,var(--c) 13%,transparent)}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-size:16.5px;font-weight:700}
  .row .tx span{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
  .row .num{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .yt{--c:#e5322d}.tgc{--c:#2597d8}.tgp{--c:#2597d8}.wa{--c:#1fa35f}.ph{--c:var(--gold-text)}

  .rain{
    width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;
    background:var(--ink);color:var(--bg);
    font-family:var(--kufi);font-size:16.5px;font-weight:700;
    box-shadow:0 14px 30px -14px rgba(42,49,66,.6);
    transition:transform .08s ease,opacity .2s ease;
  }
  .rain:hover{opacity:.92}
  .rain:active{transform:scale(.98)}
  a:focus-visible,.rain:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .in{opacity:0;transform:translateY(12px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes in{to{opacity:1;transform:none}}

  .drop{position:fixed;top:-50px;z-index:10;pointer-events:none;will-change:transform;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(var(--rot,180deg))}}

  @media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}

  #mol{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .institute,.row{background:color-mix(in srgb,var(--surface) 80%,transparent)}
</style>
</head>

<script>
// ---- chemistry background: atoms, bonds, formulas ----
(function(){
  const cv=document.getElementById('mol'),x=cv.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const S=["H","C","N","O","Na","Cl"],F=["H₂O","CO₂","NaCl","H₂SO₄","CH₄","NH₃","O₂","HCl","NaOH","C₆H₁₂O₆","6C","8O","11Na","17Cl"];
  let W,H,atoms=[],forms=[],mx=-999,my=-999,ink='#2a3142',gold='#93876b';
  function colors(){const s=getComputedStyle(document.documentElement);ink=s.getPropertyValue('--ink').trim()||ink;gold=s.getPropertyValue('--gold').trim()||gold;}
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);colors();
  const nf=r=>({x:Math.random()*W,y:r?Math.random()*H:-24,v:.25+Math.random()*.35,t:F[Math.random()*F.length|0]});
  function size(){
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(80,Math.floor(W*H/8500));
    const cols=Math.max(2,Math.round(Math.sqrt(n*W/H))),rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows;
    atoms=[];
    for(let i=0;i<cols*rows&&atoms.length<n;i++){
      const s=S[Math.random()*S.length|0];
      atoms.push({x:(i%cols+Math.random())*cw,y:(Math.floor(i/cols)+Math.random())*ch,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,s:s,r:s.length>1?15:11});
    }
    const nc=Math.max(6,Math.floor(W/85));
    forms=Array.from({length:nc},(_,i)=>{const f=nf(true);f.x=(i+Math.random()*.8)*W/nc;return f;});
  }
  addEventListener('resize',size);size();
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
  addEventListener('pointerleave',()=>{mx=my=-999;});
  function draw(){
    x.clearRect(0,0,W,H);
    x.font='15px ui-monospace,monospace';x.fillStyle=ink;x.globalAlpha=.09;
    forms.forEach((f,i)=>{f.y+=f.v;if(f.y>H+24)forms[i]=nf(false);x.fillText(f.t,f.x,f.y);});
    atoms.forEach(a=>{
      const dx=a.x-mx,dy=a.y-my,d=Math.hypot(dx,dy);
      if(d<120){a.vx+=dx/d*.05;a.vy+=dy/d*.05;}
      a.vx*=.995;a.vy*=.995;
      const sp=Math.hypot(a.vx,a.vy);if(sp>1.4){a.vx*=1.4/sp;a.vy*=1.4/sp;}
      a.x+=a.vx;a.y+=a.vy;
      if(a.x<-20)a.x=W+20;if(a.x>W+20)a.x=-20;if(a.y<-20)a.y=H+20;if(a.y>H+20)a.y=-20;
    });
    x.strokeStyle=gold;x.lineWidth=1.3;
    for(let i=0;i<atoms.length;i++)for(let j=i+1;j<atoms.length;j++){
      const d=Math.hypot(atoms[i].x-atoms[j].x,atoms[i].y-atoms[j].y);
      if(d<60&&d>0){const fx=(atoms[i].x-atoms[j].x)/d*.02,fy=(atoms[i].y-atoms[j].y)/d*.02;atoms[i].vx+=fx;atoms[i].vy+=fy;atoms[j].vx-=fx;atoms[j].vy-=fy;}
      if(d<125){x.globalAlpha=(1-d/125)*.35;x.beginPath();x.moveTo(atoms[i].x,atoms[i].y);x.lineTo(atoms[j].x,atoms[j].y);x.stroke();}
    }
    x.textAlign='center';x.textBaseline='middle';x.font='600 11px ui-monospace,monospace';
    atoms.forEach(a=>{
      x.globalAlpha=.16;x.fillStyle=gold;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
      x.globalAlpha=.5;x.strokeStyle=gold;x.stroke();
      x.globalAlpha=.6;x.fillStyle=ink;x.fillText(a.s,a.x,a.y+.5);
    });
    x.globalAlpha=1;
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw);
  }
  draw();
})();
</script>
